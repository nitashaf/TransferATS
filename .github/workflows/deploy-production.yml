name: Deploy production

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-2
      INSTANCE_ID: i-0a03231cc61e2163d
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through Systems Manager
        id: deploy
        shell: bash
        run: |
          parameters=$(jq -cn --arg sha "$DEPLOY_SHA" '{commands:[
            "set -euo pipefail",
            "cd /home/ubuntu/TransferATS",
            "test -z \"$(sudo -u ubuntu git status --porcelain --untracked-files=no)\" || { echo \"Deployment refused: tracked production files have uncommitted changes.\"; sudo -u ubuntu git status --short; exit 20; }",
            "sudo -u ubuntu git fetch --prune origin main",
            "sudo -u ubuntu git checkout --detach \"" + $sha + "\"",
            "sudo -u ubuntu /home/ubuntu/TransferATS/venv/bin/python -m pip install --requirement requirements.txt",
            "sudo -u ubuntu bash -lc \"cd /home/ubuntu/TransferATS/frontend && npm ci && npm run build\"",
            "rm -rf /var/www/html.new",
            "install -d -o www-data -g www-data /var/www/html.new",
            "cp -a frontend/dist/. /var/www/html.new/",
            "chown -R www-data:www-data /var/www/html.new",
            "rm -rf /var/www/html.previous",
            "if [ -d /var/www/html ]; then mv /var/www/html /var/www/html.previous; fi",
            "mv /var/www/html.new /var/www/html",
            "systemctl restart transferats.service",
            "nginx -t",
            "systemctl reload nginx.service",
            "for attempt in 1 2 3 4 5 6; do curl --fail --silent http://127.0.0.1:8000/health && exit 0; sleep 5; done",
            "echo \"Backend health check failed.\"",
            "journalctl -u transferats.service -n 100 --no-pager",
            "exit 21"
          ]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy TransferATS $DEPLOY_SHA" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"

      - name: Show deployment result
        if: always() && steps.deploy.outputs.command_id
        shell: bash
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'

      - name: Verify public health endpoint
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 https://transferats.neuroforge-sol.com/health
